broadcast:
  fields:
    media_source_id:
      required: true
      selector:
        text:
          placeholder: "media-source://voicebroadcast/<file>.wav"
    url:
      required: false
      selector:
        text:
          placeholder: "https://.../some.mp3"
    volume:
      required: false
      suggested: 0.6
      selector:
        number:
          min: 0
          max: 1
          step: 0.05
  target:
    entity:
      domain:
        - media_player
clear:
  fields: {}
